@media(prefers-color-scheme:dark){.background{fill:#0d1117}.grid{stroke:#30363d}.axis{fill:#8b949e}.heading{fill:#e6edf3}.meta{fill:#8b949e}.line{stroke:#58a6ff}.endpoint{fill:#58a6ff}}
</style>
